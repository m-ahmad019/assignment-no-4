<!DOCTYPE html>
<html>
<head>
    <title>Weather Station</title>
</head>

<body>

<center>
    <h1>Weather Station</h1>

    <table border="5" cellpadding="10" cellspacing="5">

        <!-- Header Row -->
        <tr>
            <th rowspan="2">
                <font size="6">Station</font>
            </th>

            <th colspan="2">
                <font size="6">Temperature</font>
            </th>

            <th rowspan="2">
                <font size="6">Humidity</font>
            </th>

            <th rowspan="2">
                <font size="6">Weather</font>
            </th>
        </tr>

        <!-- Temperature Sub-Headers -->
        <tr>
            <th>
                <font size="5">Max</font>
            </th>

            <th>
                <font size="5">Min</font>
            </th>
        </tr>

        <!-- USA -->
        <tr>
            <td>
                <font size="5">USA</font>
            </td>

            <td align="center">
                <font size="5">24</font>
            </td>

            <td align="center">
                <font size="5">19</font>
            </td>

            <td align="center">
                <font size="5">60%</font>
            </td>

            <td>
                <font size="5">cloudy</font>
            </td>
        </tr>

        <!-- Germany -->
        <tr>
            <td>
                <font size="5">Germany</font>
            </td>

            <td align="center">
                <font size="5">5</font>
            </td>

            <td align="center">
                <font size="5">-1</font>
            </td>

            <td align="center">
                <font size="5">70%</font>
            </td>

            <td>
                <font size="5">Rainy</font>
            </td>
        </tr>

    </table>
</center>

</body>
</html>
